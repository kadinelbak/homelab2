# =============================================================================
# PHASE 2 – MEDIA, STORAGE, & DOWNLOADS
# Always-On: Jellyfin, Audiobookshelf, Paperless-ngx, Immich (+ML),
#             qBittorrent behind Gluetun VPN
#
# Prereq: Phase 1 must be running (provides homelab_proxy, homelab_internal,
#         central postgres, central redis).
#
# Run:  docker compose --env-file ../.env up -d
# =============================================================================

networks:
  homelab_proxy:
    external: true
  homelab_internal:
    external: true

secrets:
  gluetun_wireguard_private_key:
    file: ${GLUETUN_SECRETS_DIR:-./secrets}/wireguard_private_key
  gluetun_wireguard_addresses:
    file: ${GLUETUN_SECRETS_DIR:-./secrets}/wireguard_addresses

services:

  # ---------------------------------------------------------------------------
  # JELLYFIN – Media Server
  # Proxy target: jellyfin:8096
  # GPU transcoding: add the deploy block below if your kernel driver is loaded.
  # ---------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    profiles: ["jellyfin", "media"]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN}
    volumes:
      - ${DATA_PATH}/phase2-media/data/jellyfin/config:/config
      - ${DATA_PATH}/phase2-media/data/jellyfin/cache:/cache
      - ${DATA_PATH}/shared/media:/media:ro    # Shared media library (read-only)
    ports:
      - "8096:8096"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin"
      - "homepage.href=http://${DOMAIN}:8096"
      - "homepage.description=Media server"

  # ---------------------------------------------------------------------------
  # AUDIOBOOKSHELF – Audiobook & Podcast Server
  # Proxy target: audiobookshelf:13378
  # ---------------------------------------------------------------------------
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    profiles: ["audiobooks", "media"]
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${DATA_PATH}/phase2-media/data/audiobookshelf/config:/config
      - ${DATA_PATH}/phase2-media/data/audiobookshelf/metadata:/metadata
      - ${DATA_PATH}/shared/media/audiobooks:/audiobooks
      - ${DATA_PATH}/shared/media/books:/books
      - ${DATA_PATH}/shared/media/podcasts:/podcasts
    ports:
      - "13378:80"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Audiobookshelf"
      - "homepage.icon=audiobookshelf"
      - "homepage.href=http://${DOMAIN}:13378"
      - "homepage.description=Audiobooks and podcasts"

  # ---------------------------------------------------------------------------
  # PAPERLESS-NGX – Document Management
  # Proxy target: paperless:8000
  # Uses central postgres (database: paperless) and central redis.
  # ---------------------------------------------------------------------------
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    profiles: ["paperless", "documents"]
    environment:
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_DBHOST: homelab_postgres
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD}@homelab_redis:6379
      PAPERLESS_URL: https://paperless.${DOMAIN}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: admin
      # Set on first run only; change via UI afterwards
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: ${AUTHENTIK_ADMIN_EMAIL}
    volumes:
      - ${DATA_PATH}/phase2-media/data/paperless/data:/usr/src/paperless/data
      - ${DATA_PATH}/phase2-media/data/paperless/media:/usr/src/paperless/media
      - ${DATA_PATH}/phase2-media/data/paperless/export:/usr/src/paperless/export
      - ${DATA_PATH}/phase2-media/data/paperless/consume:/usr/src/paperless/consume
    ports:
      - "${TAILSCALE_HOST_IP:-100.79.132.39}:8000:8000"
    networks:
      - homelab_proxy
      - homelab_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000', timeout=10)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Tools"
      - "homepage.name=Paperless-ngx"
      - "homepage.icon=paperless-ngx"
      - "homepage.href=http://${DOMAIN}:8000"
      - "homepage.description=Document management"

  # ---------------------------------------------------------------------------
  # NAVIDROME – Music Server
  # Proxy target: navidrome:4533
  # Uses the shared music library and stores its own local config database.
  # ---------------------------------------------------------------------------
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    profiles: ["music", "media"]
    user: "${PUID}:${PGID}"
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_CACHEFOLDER: /cache
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/navidrome/data:/data
      - ${DATA_PATH}/phase2-media/data/navidrome/cache:/cache
      - ${DATA_PATH}/shared/media/music:/music:ro
    ports:
      - "4533:4533"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Navidrome"
      - "homepage.icon=navidrome"
      - "homepage.href=http://${DOMAIN}:4533"
      - "homepage.description=Music server"

  # ---------------------------------------------------------------------------
  # IMMICH – Photo & Video Backup
  # Proxy target: immich-server:2283
  # Uses its OWN dedicated postgres (requires pgvecto.rs extension).
  # ---------------------------------------------------------------------------
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    restart: unless-stopped
    profiles: ["immich", "photos"]
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
      REDIS_HOSTNAME: homelab_redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      UPLOAD_LOCATION: /usr/src/app/upload
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/authentik.crt
    volumes:
      - ${DATA_PATH}/phase2-media/data/immich/upload:/usr/src/app/upload
      - ${DATA_PATH}/phase1-core/data/authentik/certs/immich-authentik-ca.crt:/usr/local/share/ca-certificates/authentik.crt:ro
    ports:
      - "2283:2283"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      immich-postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Immich"
      - "homepage.icon=immich"
      - "homepage.href=http://${DOMAIN}:2283"
      - "homepage.description=Photo and video backup"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_ml
    restart: unless-stopped
    profiles: ["immich-ml"]
    # ML container is memory-heavy. If RAM is critically low, stop this
    # specific container: docker stop immich_ml
    # Face/CLIP features will degrade but photos still back up.
    volumes:
      - ${DATA_PATH}/phase2-media/data/immich/ml-cache:/cache
    networks:
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Immich-specific PostgreSQL with vectorchord extension
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    profiles: ["immich", "photos", "immich-ml"]
    environment:
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    shm_size: 128mb
    volumes:
      - ${DATA_PATH}/phase2-media/data/immich/db:/var/lib/postgresql/data
    networks:
      - homelab_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IMMICH_DB_USERNAME} -d ${IMMICH_DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Pin DB

  # ---------------------------------------------------------------------------
  # GLUETUN – VPN Gateway Container
  # qBittorrent routes ALL traffic through this container.
  # If Gluetun goes down, qBittorrent loses all connectivity (kill switch).
  # Adjust environment vars for your VPN provider.
  # Docs: https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    profiles:
      - torrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/gluetun_wireguard_private_key
      WIREGUARD_ADDRESSES_SECRETFILE: /run/secrets/gluetun_wireguard_addresses
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      TZ: ${TZ}
      # Expose the qBittorrent Web UI port through Gluetun:
      HTTPPROXY: "off"
      SHADOWSOCKS: "off"
    ports:
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:8097:8097"   # qBittorrent Web UI
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:9696:9696"   # Prowlarr Web UI
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:6767:6767"   # Bazarr Web UI
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:8989:8989"   # Sonarr Web UI
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:7878:7878"   # Radarr Web UI
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:8686:8686"   # Lidarr Web UI
      - "${TAILSCALE_HOST_IP:-127.0.0.1}:8787:8787"   # Readarr Web UI
    networks:
      - homelab_proxy   # So NPM can reach the Web UI via Gluetun's IP
    secrets:
      - gluetun_wireguard_private_key
      - gluetun_wireguard_addresses
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # QBITTORRENT – Torrent Client
  # CRITICAL: network_mode routes ALL traffic through Gluetun.
  # This container has NO direct network access – it inherits Gluetun's VPN.
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    profiles:
      - torrent
    network_mode: service:gluetun    # ← All traffic through VPN – DO NOT CHANGE
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8097
      TORRENTING_PORT: ${QBITTORRENT_LISTEN_PORT:-56789}
    volumes:
      - ${DATA_PATH}/phase2-media/data/qbittorrent/config:/config
      - ${DATA_PATH}/shared/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent"
      - "homepage.href=http://${DOCKER_HOST_IP}:8097"
      - "homepage.description=Torrent client over VPN"

  # ---------------------------------------------------------------------------
  # PROWLARR – Indexer Aggregator
  # Proxy target: prowlarr:9696
  # Manages torrent/usenet indexers for *arr stack (Sonarr, Radarr, Bazarr)
  # ---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    profiles: ["prowlarr", "arr"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/prowlarr:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr"
      - "homepage.href=http://${DOMAIN}:9696"
      - "homepage.description=Indexer aggregator"

  # ---------------------------------------------------------------------------
  # BAZARR – Subtitle Manager
  # Proxy target: bazarr:6767
  # Automatically downloads subtitles for your media library.
  # Integrates with Sonarr/Radarr and Jellyfin.
  # ---------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    profiles: ["bazarr", "arr"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/bazarr:/config
      - ${DATA_PATH}/shared/media:/media
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=Bazarr"
      - "homepage.icon=bazarr"
      - "homepage.href=http://${DOMAIN}:6767"
      - "homepage.description=Subtitle manager"

  # ---------------------------------------------------------------------------
  # SONARR - TV Series Automation
  # Proxy target: sonarr:8989
  # Uses Prowlarr for indexers and qBittorrent through Gluetun for downloads.
  # ---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    profiles: ["sonarr", "arr"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/sonarr:/config
      - ${DATA_PATH}/shared/media:/media
      - ${DATA_PATH}/shared/media/tv:/tv
      - ${DATA_PATH}/shared/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=Sonarr"
      - "homepage.icon=sonarr"
      - "homepage.href=http://${DOMAIN}:8989"
      - "homepage.description=TV series automation"

  # ---------------------------------------------------------------------------
  # RADARR - Movie Automation
  # Proxy target: radarr:7878
  # Uses Prowlarr for indexers and qBittorrent through Gluetun for downloads.
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    profiles: ["radarr", "arr"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/radarr:/config
      - ${DATA_PATH}/shared/media:/media
      - ${DATA_PATH}/shared/media/movies:/movies
      - ${DATA_PATH}/shared/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=Radarr"
      - "homepage.icon=radarr"
      - "homepage.href=http://${DOMAIN}:7878"
      - "homepage.description=Movie automation"

  # ---------------------------------------------------------------------------
  # LIDARR - Music Automation
  # Proxy target: lidarr:8686
  # Uses Prowlarr for indexers and qBittorrent through Gluetun for downloads.
  # ---------------------------------------------------------------------------
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    profiles: ["lidarr", "arr"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/lidarr:/config
      - ${DATA_PATH}/shared/media:/media
      - ${DATA_PATH}/shared/media/music:/music
      - ${DATA_PATH}/shared/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=Lidarr"
      - "homepage.icon=lidarr"
      - "homepage.href=http://${DOMAIN}:8686"
      - "homepage.description=Music automation"

  # ---------------------------------------------------------------------------
  # READARR - Book Automation
  # Proxy target: readarr:8787
  # Uses Prowlarr for indexers and qBittorrent through Gluetun for downloads.
  # ---------------------------------------------------------------------------
  readarr:
    image: lscr.io/linuxserver/readarr:amd64-0.4.18-develop
    container_name: readarr
    restart: unless-stopped
    profiles: ["readarr", "arr"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase2-media/data/readarr:/config
      - ${DATA_PATH}/shared/media:/media
      - ${DATA_PATH}/shared/media/books:/books
      - ${DATA_PATH}/shared/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media Automations"
      - "homepage.name=Readarr"
      - "homepage.icon=readarr"
      - "homepage.href=http://${DOMAIN}:8787"
      - "homepage.description=Book automation"
