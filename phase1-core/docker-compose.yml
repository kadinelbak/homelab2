    - "homepage.href=http://:8500"
    - "homepage.description=Service discovery & mesh control"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH}/phase1-core:/phase1-core:ro
      - ${DATA_PATH}/phase2-media:/phase2-media:ro
      - ${DATA_PATH}/phase3-ai-gaming:/phase3-ai-gaming:ro
      - ${DATA_PATH}/phase4-ondemand:/phase4-ondemand:ro
      - resource-optimizer-data:/app/data
    networks:
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Maintenance"
      - "homepage.name=Resource Optimizer"
      - "homepage.icon=memory"
      - "homepage.href=http://${DOMAIN}:9095"
      - "homepage.description=Intelligent resource management"
wol-api:
  image: wolapi:latest
  container_name: homelab_wol_api
  restart: unless-stopped
  environment:
    - TZ=
    - WOL_API_KEY=
    - WOL_MAC_ADDRESS=
  volumes:
    - ./wol-api:/app
    - /etc/wol/mac.address:/etc/wol/mac.address:ro
  networks:
    - homelab_internal
  labels:
    - "com.centurylinklabs.watchtower.enable=true"
    - "homepage.group=Maintenance"
    - "homepage.name=WoL API"
    - "homepage.icon=remote"
    - "homepage.href=http://:9999"
    - "homepage.description=Wake-on-LAN API"

backup:
  image: restic/restic:latest
  container_name: homelab_backup
  restart: unless-stopped
  volumes:
    - :/data:ro
    - ./backup:/backup
    - /etc/localtime:/etc/localtime:ro
  environment:
    - RESTIC_REPOSITORY=/backup/local
    - RESTIC_PASSWORD_FILE=/backup/secrets/restic-pass
    - AWS_ACCESS_KEY_ID=
    - AWS_SECRET_ACCESS_KEY=
    - AWS_DEFAULT_REGION=us-east-1
    - S3_ENDPOINT=
  command: ["sh", "-c", "while true; do /backup/run-backup.sh; sleep 3600; done"]
  labels:
    - "com.centurylinklabs.watchtower.enable=true"
    - "homepage.group=Maintenance"
    - "homepage.name=Backup Orchestrator"
    - "homepage.icon=harddisk"
    - "homepage.href=http://:8091"
    - "homepage.description=Automated backups"

suricata:
  image: jasonish/suricata:latest
  container_name: homelab_suricata
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - NET_RAW
  volumes:
    - /phase1-core/data/suricata:/etc/suricata
    - /var/log/suricata:/var/log/suricata
    - /etc/localtime:/etc/localtime:ro
  networks:
    - homelab_internal
  command: ["-c", "/etc/suricata/suricata.yaml", "-i", "eth0"]
  labels:
    - "com.centurylinklabs.watchtower.enable=true"
    - "homepage.group=Security"
    - "homepage.name=Suricata IDS"
    - "homepage.href=http://:8092"
    - "homepage.description=Network intrusion detection"

trivy-scan:
  image: aquasec/trivy:latest
  container_name: homelab_trivy
  restart: "no"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /phase1-core/data/trivy:/cache
  environment:
    - TRIVY_SEVERITY=CRITICAL,HIGH
  command: ["sh", "-c", "while true; do /scan/scan-images.sh; sleep 86400; done"]
  labels:
    - "com.centurylinklabs.watchtower.enable=true"
    - "homepage.group=Security"
    - "homepage.name=Trivy Scanner"
    - "homepage.description=Vulnerability scanning"

metadata:
  image: appropriate/curl:latest
  container_name: homelab_metadata
  restart: unless-stopped
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /phase1-core:/phase1-core:ro
    - /phase2-media:/phase2-media:ro
    - /phase3-ai-gaming:/phase3-ai-gaming:ro
    - /phase4-ondemand:/phase4-ondemand:ro
  command: ["sh", "-c", "while true; do /collect/metadata.sh; sleep 30; done"]
  labels:
    - "com.centurylinklabs.watchtower.enable=true"
    - "homepage.group=Maintenance"
    - "homepage.name=Metadata Collector"
    - "homepage.description=Collects service metadata"

consul-server:
  image: hashicorp/consul:latest
  container_name: homelab_consul
  restart: unless-stopped
  command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
  ports:
    - "8500:8500"
    - "8600:8600/tcp"
    - "8600:8600/udp"
  volumes:
    - /phase1-core/data/consul:/consul/data
  environment:
    - CONSUL_LOCAL_CONFIG={leave_on_terminate: true}
  networks:
    - homelab_internal
  labels:
    - "com.centurylinklabs.watchtower.enable=true"
    - "homepage.group=Maintenance"
    - "homepage.name=Consul UI"
    - "homepage.href=http://:8500"
    - "homepage.description=Service discovery & mesh control"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
  resource-optimizer_data:

