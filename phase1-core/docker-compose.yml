# =============================================================================
# PHASE 1 - CORE INFRASTRUCTURE
#
# Start from the repository root with:
#   docker compose --env-file .env -f phase1-core/docker-compose.yml up -d
# =============================================================================

x-common-labels: &common-labels
  com.centurylinklabs.watchtower.enable: "true"

x-critical: &critical
  homelab.tier: critical
  homelab.profile: always-on

x-important: &important
  homelab.tier: important
  homelab.profile: always-on

x-background: &background
  homelab.tier: background
  homelab.profile: maintenance

networks:
  homelab_proxy:
    name: homelab_proxy
    driver: bridge
  homelab_internal:
    name: homelab_internal
    driver: bridge
    internal: false

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: homelab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/postgres:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - homelab_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      <<: [*common-labels, *critical]
      com.centurylinklabs.watchtower.enable: "false"
      homelab.service: postgres
      homelab.depends_on: none

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@homelab_postgres:5432/postgres?sslmode=disable
    networks:
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      <<: [*common-labels, *background]
      homelab.service: postgres-exporter
      homelab.depends_on: postgres

  redis:
    image: redis:7-alpine
    container_name: homelab_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/redis:/data
    networks:
      - homelab_internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      <<: [*common-labels, *critical]
      com.centurylinklabs.watchtower.enable: "false"
      homelab.service: redis
      homelab.depends_on: none

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://homelab_redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - homelab_internal
    depends_on:
      redis:
        condition: service_healthy
    labels:
      <<: [*common-labels, *background]
      homelab.service: redis-exporter
      homelab.depends_on: redis

  npm:
    image: jc21/nginx-proxy-manager:2.11.3
    container_name: npm
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "80:80"
      - "81:81"
      - "4443:443"
    volumes:
      - ${DATA_PATH}/phase1-core/data/npm/data:/data
      - ${DATA_PATH}/phase1-core/data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      <<: [*common-labels, *critical]
      homelab.service: npm
      homelab.depends_on: none
      homepage.group: Core
      homepage.name: Nginx Proxy Manager
      homepage.icon: nginx-proxy-manager
      homepage.href: http://${DOMAIN}:81
      homepage.description: Reverse proxy and TLS management

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.6.4
    container_name: authentik_server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: homelab_redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: homelab_postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/authentik/media:/media
      - ${DATA_PATH}/phase1-core/data/authentik/custom-templates:/templates
      - ${DATA_PATH}/phase1-core/data/authentik/certs:/certs
    ports:
      - "9001:9000"
      - "9443:9443"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      <<: [*common-labels, *critical]
      homelab.service: authentik-server
      homelab.depends_on: postgres,redis
      homepage.group: Core
      homepage.name: Authentik
      homepage.icon: authentik
      homepage.href: http://${DOMAIN}:9001
      homepage.description: Identity provider and SSO

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.6.4
    container_name: authentik_worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: homelab_redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: homelab_postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      TZ: ${TZ}
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH}/phase1-core/data/authentik/media:/media
      - ${DATA_PATH}/phase1-core/data/authentik/custom-templates:/templates
      - ${DATA_PATH}/phase1-core/data/authentik/certs:/certs
    networks:
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      <<: [*common-labels, *critical]
      homelab.service: authentik-worker
      homelab.depends_on: postgres,redis,authentik-server

  homepage:
    image: ghcr.io/gethomepage/homepage:v0.9.11
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN},${DOCKER_HOST_IP},localhost,127.0.0.1
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - ${DATA_PATH}/phase1-core/data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      <<: [*common-labels, *important]
      homelab.service: homepage
      homelab.depends_on: npm,authentik-server
      homepage.group: Core
      homepage.name: Homepage
      homepage.icon: homepage
      homepage.href: http://${DOMAIN}:3000
      homepage.description: Service launcher

  portainer:
    image: portainer/portainer-ce:2.20.3
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}/phase1-core/data/portainer:/data
    ports:
      - "9000:9000"
    networks:
      - homelab_proxy
    labels:
      <<: [*common-labels, *important]
      homelab.service: portainer
      homelab.depends_on: none
      homepage.group: Core
      homepage.name: Portainer
      homepage.icon: portainer
      homepage.href: http://${DOMAIN}:9000
      homepage.description: Container management

  vaultwarden:
    image: vaultwarden/server:1.31.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vaultwarden.${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@homelab_postgres:5432/vaultwarden
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      LOG_LEVEL: info
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/vaultwarden:/data
    ports:
      - "7070:80"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      <<: [*common-labels, *critical]
      homelab.service: vaultwarden
      homelab.depends_on: postgres
      homepage.group: Core
      homepage.name: Vaultwarden
      homepage.icon: vaultwarden
      homepage.href: https://${DOMAIN}:4443
      homepage.description: Password manager

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /etc/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: read-write
    volumes:
      - ${DATA_PATH}/phase1-core/data/ntfy/cache:/var/cache/ntfy
      - ${DATA_PATH}/phase1-core/data/ntfy/etc:/etc/ntfy
    ports:
      - "8085:80"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      <<: [*common-labels, *important]
      homelab.service: ntfy
      homelab.depends_on: none
      homepage.group: Core
      homepage.name: ntfy
      homepage.icon: ntfy
      homepage.href: http://${DOMAIN}:8085
      homepage.description: Push notifications

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}/phase1-core/data/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      <<: [*common-labels, *important]
      homelab.service: uptime-kuma
      homelab.depends_on: none
      homepage.group: Monitoring
      homepage.name: Uptime Kuma
      homepage.icon: uptime-kuma
      homepage.href: http://${DOMAIN}:3001
      homepage.description: Uptime checks

  beszel-hub:
    image: henrygd/beszel:0.6.2
    container_name: beszel_hub
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}/phase1-core/data/beszel/hub:/beszel_data
    ports:
      - "8090:8090"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      <<: [*common-labels, *important]
      homelab.service: beszel-hub
      homelab.depends_on: none
      homepage.group: Monitoring
      homepage.name: Beszel
      homepage.icon: beszel
      homepage.href: http://${DOMAIN}:8090
      homepage.description: Lightweight system monitoring

  beszel-agent:
    image: henrygd/beszel-agent:0.6.2
    container_name: beszel_agent
    restart: unless-stopped
    network_mode: host
    environment:
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: ${BESZEL_HUB_URL}
      LISTEN: "45876"
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - beszel-hub
    labels:
      <<: [*common-labels, *important]
      homelab.service: beszel-agent
      homelab.depends_on: beszel-hub

  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.8.1-omnibus
    container_name: scrutiny
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    environment:
      SCRUTINY_WEB_LISTEN_ADDRESS_PORT: "8080"
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/scrutiny/config:/opt/scrutiny/config
      - ${DATA_PATH}/phase1-core/data/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
      - /dev:/dev
    ports:
      - "8089:8080"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      <<: [*common-labels, *important]
      homelab.service: scrutiny
      homelab.depends_on: none
      homepage.group: Monitoring
      homepage.name: Scrutiny
      homepage.icon: scrutiny
      homepage.href: http://${DOMAIN}:8089
      homepage.description: Disk health

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: homelab_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert.rules:/etc/prometheus/alert.rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - homelab_internal
      - homelab_proxy
    labels:
      <<: [*common-labels, *critical]
      homelab.service: prometheus
      homelab.depends_on: node_exporter,cadvisor
      homepage.group: Monitoring
      homepage.name: Prometheus
      homepage.icon: prometheus
      homepage.href: http://${DOMAIN}:9090
      homepage.description: Metrics database

  grafana:
    image: grafana/grafana:11.1.0
    container_name: homelab_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${AUTHENTIK_URL}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${AUTHENTIK_URL}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: ${AUTHENTIK_URL}/application/o/userinfo/
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${AUTHENTIK_URL}/application/o/grafana/end-session/
      TZ: ${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "30030:3000"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      - prometheus
      - loki
    labels:
      <<: [*common-labels, *important]
      homelab.service: grafana
      homelab.depends_on: prometheus,loki
      homepage.group: Monitoring
      homepage.name: Grafana
      homepage.icon: grafana
      homepage.href: http://${DOMAIN}:30030
      homepage.description: Dashboards and alert visualization

  loki:
    image: grafana/loki:3.1.0
    container_name: homelab_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - homelab_internal
      - homelab_proxy
    labels:
      <<: [*common-labels, *important]
      homelab.service: loki
      homelab.depends_on: none
      homepage.group: Monitoring
      homepage.name: Loki
      homepage.icon: loki
      homepage.href: http://${DOMAIN}:3100
      homepage.description: Log storage

  promtail:
    image: grafana/promtail:3.1.0
    container_name: homelab_promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ../monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - homelab_internal
    depends_on:
      - loki
    labels:
      <<: [*common-labels, *background]
      homelab.service: promtail
      homelab.depends_on: loki

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: homelab_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
      - --config.expand-env
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      NTFY_TOPIC: ${NTFY_TOPIC}
    volumes:
      - ../monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - homelab_internal
      - homelab_proxy
    labels:
      <<: [*common-labels, *important]
      homelab.service: alertmanager
      homelab.depends_on: prometheus,ntfy
      homepage.group: Monitoring
      homepage.name: Alertmanager
      homepage.icon: alertmanager
      homepage.href: http://${DOMAIN}:9093
      homepage.description: Alert routing

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: homelab_node_exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile_collector
    volumes:
      - /:/host:ro,rslave
      - ${DATA_PATH}/phase1-core/data/node-exporter/textfile_collector:/textfile_collector:ro
    networks:
      - homelab_internal
    labels:
      <<: [*common-labels, *background]
      homelab.service: node_exporter
      homelab.depends_on: none

  backup:
    build:
      context: ../backup
    image: homelab/backup:local
    container_name: homelab_backup
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DATA_ROOT: /data
      REPO_ROOT: /repo
      STATE_DIR: /backup/state
      METRICS_DIR: /metrics
      POSTGRES_HOST: homelab_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: /backup/repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS}
    volumes:
      - ${DATA_PATH}:/data:ro
      - ..:/repo:ro
      - ${DATA_PATH}/phase1-core/data/backup:/backup
      - ${DATA_PATH}/phase1-core/data/node-exporter/textfile_collector:/metrics
    networks:
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      <<: [*common-labels, *background]
      homelab.service: backup
      homelab.depends_on: postgres,node_exporter
      homepage.group: Maintenance
      homepage.name: Backup
      homepage.icon: harddisk
      homepage.description: Restic backup executor

  wol-api:
    build:
      context: ../wol-api
    image: homelab/wol-api:local
    container_name: homelab_wol_api
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WOL_API_KEY: ${WOL_API_KEY}
      WOL_MAC_ADDRESS: ${WOL_MAC_ADDRESS}
      WOL_BROADCAST_ADDRESS: ${WOL_BROADCAST_ADDRESS}
      WOL_PORT: ${WOL_PORT}
    ports:
      - "9999:9999"
    networks:
      - homelab_internal
      - homelab_proxy
    labels:
      <<: [*common-labels, *background]
      homelab.service: wol-api
      homelab.depends_on: none
      homepage.group: Maintenance
      homepage.name: Wake-on-LAN
      homepage.icon: remote
      homepage.href: http://${DOMAIN}:9999/health
      homepage.description: Authenticated Wake-on-LAN endpoint

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: homelab_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - homelab_internal
    labels:
      <<: [*common-labels, *background]
      homelab.service: cadvisor
      homelab.depends_on: none

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
      - --schedule
      - ${WATCHTOWER_CRON}
      - --notification-url
      - ${WATCHTOWER_NOTIFICATION_URL}
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homelab_internal
    labels:
      <<: [*background]
      com.centurylinklabs.watchtower.enable: "false"
      homelab.service: watchtower
      homelab.depends_on: ntfy
