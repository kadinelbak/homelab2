# =============================================================================
# PHASE 1 – CORE INFRASTRUCTURE
# Always-On: Central DB/Cache, Portainer, NPM, Authentik, Homepage,
#             Beszel, Uptime Kuma, Watchtower, ntfy
#
# Run:  docker compose --env-file ../.env up -d
# =============================================================================

networks:
  # Shared across ALL phases – created here, referenced as external elsewhere.
  homelab_proxy:
    name: homelab_proxy
    driver: bridge
  homelab_internal:
    name: homelab_internal
    driver: bridge

# ---------------------------------------------------------------------------
# CENTRAL POSTGRESQL
# Hosts databases for: Authentik, Paperless, n8n, Gitea, Nextcloud,
#                      Outline, Cal.com, NocoDB, Guacamole
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: homelab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ${DATA_PATH}/phase1-core/data/postgres:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - homelab_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Pin DB – no auto-updates

  # ---------------------------------------------------------------------------
  # CENTRAL REDIS
  # Used by: Authentik, Paperless-ngx
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: homelab_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DATA_PATH}/phase1-core/data/redis:/data
    networks:
      - homelab_internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Pin cache – no auto-updates

  # ---------------------------------------------------------------------------
  # PORTAINER – Container Management UI
  # UI: http://host:9000  |  Proxy to: portainer:9000
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH}/phase1-core/data/portainer:/data
    ports:
      - "9000:9000"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Maintenance"
      - "homepage.name=Portainer"
      - "homepage.icon=portainer"
      - "homepage.href=http://${DOMAIN}:9000"
      - "homepage.description=Container management"

  # ---------------------------------------------------------------------------
  # NGINX PROXY MANAGER (NPM) – Reverse Proxy + TLS
  # UI: http://host:81  |  Proxy listeners: 80/443
  # ---------------------------------------------------------------------------
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "80:80"
      - "81:81"
      - "4443:443"
    volumes:
      - ${DATA_PATH}/phase1-core/data/npm/data:/data
      - ${DATA_PATH}/phase1-core/data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Maintenance"
      - "homepage.name=Nginx Proxy Manager"
      - "homepage.icon=nginx-proxy-manager"
      - "homepage.href=http://${DOMAIN}:81"
      - "homepage.description=Reverse proxy and SSL"

  # ---------------------------------------------------------------------------
  # AUTHENTIK – SSO / Identity Provider
  # Proxy target: authentik-server:9000
  # ---------------------------------------------------------------------------
  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik_server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: homelab_redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: homelab_postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: warning
    volumes:
      - ${DATA_PATH}/phase1-core/data/authentik/media:/media
      - ${DATA_PATH}/phase1-core/data/authentik/custom-templates:/templates
    ports:
      - "9001:9000"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Maintenance"
      - "homepage.name=Authentik"
      - "homepage.icon=authentik"
      - "homepage.href=http://${DOMAIN}:9001"
      - "homepage.description=Identity and SSO"

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik_worker
    restart: unless-stopped
    command: worker
    # Worker runs as root to access docker socket for blueprints; this matches
    # the official Authentik docker-compose recommendation.
    environment:
      AUTHENTIK_REDIS__HOST: homelab_redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: homelab_postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH}/phase1-core/data/authentik/media:/media
      - ${DATA_PATH}/phase1-core/data/authentik/certs:/certs
      - ${DATA_PATH}/phase1-core/data/authentik/custom-templates:/templates
    networks:
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # HOMEPAGE – Service Dashboard
  # Proxy target: homepage:3000
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    user: "0:0"  # Needed to read /var/run/docker.sock for label discovery
    group_add:
      - "125"     # Host docker group gid for /var/run/docker.sock access
    environment:
      - PUID=0
      - PGID=0
      - HOMEPAGE_ALLOWED_HOSTS=100.79.132.39:3000, localhost, 127.0.0.1, 10.1.38.234:3000,kadin-main-sys.tail00cf0e.ts.net:3000
    volumes:
      - ${DATA_PATH}/phase1-core/data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # BESZEL – Lightweight System Monitoring
  # Hub proxy target: beszel-hub:8090
  # Agent uses host networking for full system metric access.
  # ---------------------------------------------------------------------------
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel_hub
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}/phase1-core/data/beszel/hub:/beszel_data
    ports:
      - "8090:8090"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Monitoring"
      - "homepage.name=Beszel Hub"
      - "homepage.icon=beszel"
      - "homepage.href=http://${DOMAIN}:8090"
      - "homepage.description=Host monitoring"

  beszel-agent:
    image: henrygd/beszel-agent-nvidia:latest
    container_name: beszel_agent
    restart: unless-stopped
    network_mode: host          # Required for host-level metrics
    pid: host                   # Required for process metrics
    gpus: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH}/phase1-core/data/beszel/agent:/var/lib/beszel-agent
    environment:
      PORT: 45876
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: ${BESZEL_HUB_URL:-http://127.0.0.1:8090}
      GPU_COLLECTOR: nvml
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # UPTIME KUMA – Service Uptime Monitoring
  # Proxy target: uptime-kuma:3001
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}/phase1-core/data/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Monitoring"
      - "homepage.name=Uptime Kuma"
      - "homepage.icon=uptime-kuma"
      - "homepage.href=http://${DOMAIN}:3001"
      - "homepage.description=Uptime monitoring"

  # ---------------------------------------------------------------------------
  # WATCHTOWER – Automated Container Updates
  # Label-controlled: only updates containers with watchtower.enable=true.
  # Runs nightly at 4 AM, notifies via ntfy.
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # Cron: 04:00 daily
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab_internal
    depends_on:
      - ntfy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ---------------------------------------------------------------------------
  # SCRUTINY – Drive Health Monitoring
  # Proxy target: scrutiny:8080
  # Monitors disk health via SMART attributes and sends alerts on failures.
  # First-time setup: Navigate to http://localhost:8089, go to "Settings" tab,
  # and enable monitoring for your drives. Scrutiny will auto-scan /dev/* paths.
  # ---------------------------------------------------------------------------
  scrutiny:
    image: ghcr.io/analogj/scrutiny:latest
    container_name: scrutiny
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    environment:
      SCRUTINY_API_ENDPOINT_HOST: 0.0.0.0
      SCRUTINY_API_ENDPOINT_PORT: 8080
      SCRUTINY_WEB_LISTEN_ADDRESS_PORT: 8080
      SCRUTINY_SCAN_INTERVAL: "24h"
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/scrutiny:/opt/scrutiny/config
      - /dev:/dev:ro
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
    ports:
      - "8089:8080"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Monitoring"
      - "homepage.name=Scrutiny"
      - "homepage.icon=harddisk"
      - "homepage.href=http://${DOMAIN}:8089"
      - "homepage.description=Drive health monitoring"

  # ---------------------------------------------------------------------------
  # VAULTWARDEN – Password Manager & Secrets Vault
  # Proxy target: vaultwarden:80
  # Uses central postgres (database: vaultwarden)
  # ---------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vaultwarden.${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@homelab_postgres:5432/vaultwarden
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      LOG_LEVEL: info
      LOG_FILE: /data/vaultwarden.log
      TZ: ${TZ}
      # Disable signups and admin panel for security unless configuring
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
    volumes:
      - ${DATA_PATH}/phase1-core/data/vaultwarden:/data
    ports:
      - "7070:80"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Maintenance"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden"
      - "homepage.href=https://${DOMAIN}:4443"
      - "homepage.description=Password manager"

  # ---------------------------------------------------------------------------
  # NTFY – Push Notification Server
  # Proxy target: ntfy:80
  # Config file: ${DATA_PATH}/phase1-core/data/ntfy/etc/server.yml
  # ---------------------------------------------------------------------------
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase1-core/data/ntfy/cache:/var/cache/ntfy
      - ${DATA_PATH}/phase1-core/data/ntfy/etc:/etc/ntfy
    ports:
      - "8085:80"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Maintenance"
      - "homepage.name=ntfy"
      - "homepage.icon=ntfy"
      - "homepage.href=http://${DOMAIN}:8085"
      - "homepage.description=Push notifications"
