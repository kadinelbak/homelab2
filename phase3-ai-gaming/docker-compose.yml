# =============================================================================
# PHASE 3 – AI, GAMING, & UTILITY
# Always-On: Ollama (+NVIDIA), Open WebUI, Minecraft, n8n, Home Assistant,
#             Spoolman, Actual Budget, Stirling PDF, IT-Tools
#
# Prereq: Phase 1 must be running.
# GPU Prereq: NVIDIA Container Toolkit must be installed on the host.
#   Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Run:  docker compose --env-file ../.env up -d
# =============================================================================

networks:
  homelab_proxy:
    external: true
  homelab_internal:
    external: true

services:

  # ---------------------------------------------------------------------------
  # OLLAMA – Local LLM Inference Engine
  # CRITICAL: deploy block grants access to the NVIDIA RTX 3050.
  # The toolkit must be installed on the host BEFORE starting this container.
  # Proxy target: ollama:11434  (used internally by Open WebUI)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m        # Unload model after 5 min idle to free VRAM
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - homelab_internal           # Open WebUI talks to it internally
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # OPEN WEBUI – Chat UI for Ollama (and OpenAI-compatible APIs)
  # Proxy target: open-webui:8080
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${N8N_ENCRYPTION_KEY}   # Reuse a strong secret for session signing
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/openwebui:/app/backend/data
    ports:
      - "8080:8080"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      - ollama
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=AI Automations"
      - "homepage.name=Open WebUI"
      - "homepage.icon=open-webui"
      - "homepage.href=http://${DOMAIN}:8080"
      - "homepage.description=Chat interface for Ollama"

  # ---------------------------------------------------------------------------
  # MINECRAFT – Game Server (itzg/minecraft-server)
  # Port 25565 exposed directly (not behind NPM – TCP, not HTTP).
  # Modpack: Configure MODPACK_URL or TYPE=FORGE and drop mods in /data/mods.
  # See all env vars: https://github.com/itzg/docker-minecraft-server
  # ---------------------------------------------------------------------------
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: ${MINECRAFT_EULA}
      MEMORY: ${MINECRAFT_MEMORY}
      TYPE: ${MINECRAFT_TYPE}       # FORGE for Biomes O' Plenty
      VERSION: ${MINECRAFT_VERSION}
      OPS: ${MINECRAFT_OPS}
      TZ: ${TZ}
      # Biomes O' Plenty & heavy mods need more memory – tune MINECRAFT_MEMORY.
      # For a CurseForge modpack, set TYPE=AUTO and MODPACK_URL=<manifest url>
      DIFFICULTY: normal
      MAX_PLAYERS: 10
      VIEW_DISTANCE: 8             # Reduce if server lags under 16GB RAM
      MOTD: "Homelab Minecraft"
      SPAWN_PROTECTION: 0
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/minecraft:/data
    # No network needed – only exposes port to LAN
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Pin game server version

  # ---------------------------------------------------------------------------
  # N8N – Workflow Automation
  # Proxy target: n8n:5678
  # Uses central postgres (database: n8n).
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      N8N_HOST: ${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${DOMAIN}:5678/
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: homelab_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168    # Keep execution logs 7 days
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/n8n:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=AI Automations"
      - "homepage.name=n8n"
      - "homepage.icon=n8n"
      - "homepage.href=http://${DOMAIN}:5678"
      - "homepage.description=Workflow automation"

  # ---------------------------------------------------------------------------
  # HOME ASSISTANT – Smart Home Hub
  # Uses host networking for mDNS, Zigbee USB, and LAN device discovery.
  # Access at: http://host:8123  |  Proxy target: localhost:8123
  # If you do NOT need host-level discovery, you can remove network_mode: host
  # and add it to the homelab_proxy network instead.
  # ---------------------------------------------------------------------------
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true              # Required for USB device passthrough (Zigbee/Z-Wave)
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/homeassistant:/config
      - /run/dbus:/run/dbus:ro    # Bluetooth access
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Tools"
      - "homepage.name=Home Assistant"
      - "homepage.icon=home-assistant"
      - "homepage.href=http://${DOMAIN}:8123"
      - "homepage.description=Smart home hub"

  # ---------------------------------------------------------------------------
  # SPOOLMAN – 3D Printing Filament Tracker
  # Proxy target: spoolman:8000
  # ---------------------------------------------------------------------------
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/spoolman:/home/app/.local/share/spoolman
    ports:
      - "7912:8000"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Tools"
      - "homepage.name=Spoolman"
      - "homepage.icon=spoolman"
      - "homepage.href=http://${DOMAIN}:7912"
      - "homepage.description=Filament tracking"

  # ---------------------------------------------------------------------------
  # ACTUAL BUDGET – Local-First Personal Finance
  # Proxy target: actual-budget:5006
  # ---------------------------------------------------------------------------
  actual-budget:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual_budget
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/actual:/data
    ports:
      - "5006:5006"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Tools"
      - "homepage.name=Actual Budget"
      - "homepage.icon=actual-budget"
      - "homepage.href=http://localhost:5006"
      - "homepage.description=Personal finance"

  # ---------------------------------------------------------------------------
  # STIRLING PDF – Local PDF Toolkit
  # Proxy target: stirling-pdf:8080
  # ---------------------------------------------------------------------------
  stirling-pdf:
    image: ghcr.io/stirling-tools/stirling-pdf:latest
    container_name: stirling_pdf
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/stirling-pdf:/configs
    ports:
      - "8086:8080"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Tools"
      - "homepage.name=Stirling PDF"
      - "homepage.icon=stirling-pdf"
      - "homepage.href=http://${DOMAIN}:8086"
      - "homepage.description=Self-hosted PDF tools"

  # ---------------------------------------------------------------------------
  # IT-TOOLS – Handy Utility Toolbox for Developers
  # Proxy target: it-tools:80
  # ---------------------------------------------------------------------------
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it_tools
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8087:80"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Tools"
      - "homepage.name=IT-Tools"
      - "homepage.icon=it-tools"
      - "homepage.href=http://${DOMAIN}:8087"
      - "homepage.description=Developer utility toolbox"

  # ---------------------------------------------------------------------------
  # WEB GAMES – Local no-ads browser games (Tailscale/port access recommended)
  # Access target: http://<tailnet-host>:8092
  # Intentionally NOT attached to homelab_proxy to avoid accidental NPM routing.
  # ---------------------------------------------------------------------------
  web-games:
    image: nginx:1.27-alpine
    container_name: web_games
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8092:80"
    volumes:
      - ./games-portal:/usr/share/nginx/html:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Gaming"
      - "homepage.name=Web Games"
      - "homepage.icon=nintendo-switch"
      - "homepage.href=http://${DOMAIN}:8092"
      - "homepage.description=Self-hosted no-ads browser games"

  # ---------------------------------------------------------------------------
  # GAME SERVER – Shared multiplayer backend (currently checkers module)
  # Access target: http://<tailnet-host>:8093
  # Intended for tailscale/port access only. Hidden from Homepage dashboard.
  # ---------------------------------------------------------------------------
  game-server:
    build:
      context: ./checkers-mp
    container_name: game_server
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8093:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ---------------------------------------------------------------------------
  # HEARTS MP – MIT open-source room-based multiplayer hearts
  # Access target: http://<tailnet-host>:8094
  # Intended for tailscale/port access only. Hidden from Homepage dashboard.
  # ---------------------------------------------------------------------------
  hearts-mp:
    build:
      context: ./hearts-mp
    container_name: hearts_mp
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8094:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
