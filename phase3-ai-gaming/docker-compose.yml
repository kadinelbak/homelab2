      SECURITY_INITIALLOGIN_USERNAME: ${STIRLING_PDF_INITIAL_USERNAME:-admin}
      SECURITY_INITIALLOGIN_PASSWORD: ${STIRLING_PDF_INITIAL_PASSWORD:-stirling}
    volumes:
      - ${DATA_PATH}/phase3-ai-gaming/data/stirling-pdf:/configs
    ports:
      - "8086:8080"
    networks:
