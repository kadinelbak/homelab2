<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111510">
  <title>Spanish Coach</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Español</h1>
        <p class="tagline">Speak, listen, review.</p>
      </div>
      <details class="settings">
        <summary title="Settings" aria-label="Settings">⚙</summary>
        <div class="settings-panel">
          <input id="tokenInput" type="password" placeholder="Token if set" autocomplete="off">
          <span id="health">Checking...</span>
        </div>
      </details>
    </header>

    <nav aria-label="Practice modes">
      <button data-tab="daily" class="active" title="Daily" aria-label="Daily"><span aria-hidden="true">☀</span><span class="nav-label">Daily</span></button>
      <button data-tab="coach" title="Coach" aria-label="Coach"><span aria-hidden="true">◉</span><span class="nav-label">Coach</span></button>
      <button data-tab="stories" title="Stories" aria-label="Stories"><span aria-hidden="true">▤</span><span class="nav-label">Stories</span></button>
      <button data-tab="vocab" title="Vocab" aria-label="Vocab"><span aria-hidden="true">◇</span><span class="nav-label">Vocab</span></button>
      <button data-tab="loops" title="Loops" aria-label="Loops"><span aria-hidden="true">↻</span><span class="nav-label">Loops</span></button>
    </nav>

    <div class="player panel">
      <div>
        <strong id="queueTitle">Ready</strong>
        <p id="queueNow">Pick a practice mode.</p>
      </div>
      <div class="player-controls">
        <button id="replaySegment" class="icon-button" title="Replay" aria-label="Replay"><span aria-hidden="true">↺</span></button>
        <select id="speedSelect" title="Speed" aria-label="Speed">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.15">1.15x</option>
        </select>
        <select id="pauseSelect" title="Pause" aria-label="Pause">
          <option value="0.4">short</option>
          <option value="0.9" selected>pause</option>
          <option value="1.6">long</option>
        </select>
      </div>
      <audio id="audio" controls></audio>
    </div>

    <section id="daily" class="tab active">
      <div id="stats" class="stats"></div>
      <div class="panel daily-hero">
        <div>
          <h2>Morning Spanish</h2>
          <p>One tap: listen, speak, review.</p>
        </div>
        <button id="startDaily" class="primary icon-button hero-play" title="Start daily session" aria-label="Start daily session"><span aria-hidden="true">▶</span></button>
      </div>
      <div class="topic-row" aria-label="Story topics">
        <button data-topic="travel">travel</button>
        <button data-topic="food">food</button>
        <button data-topic="family">family</button>
        <button data-topic="work">work</button>
        <button data-topic="survival Spanish">survival</button>
      </div>
      <div id="dailyOutput" class="stack"></div>
    </section>

    <section id="coach" class="tab">
      <div class="panel">
        <textarea id="chatInput" rows="4" placeholder="Talk or type..."></textarea>
        <div class="actions">
          <button id="sendChat" class="primary icon-button" title="Send" aria-label="Send"><span aria-hidden="true">→</span></button>
          <button id="recordBtn" class="icon-button" title="Record" aria-label="Record"><span aria-hidden="true">●</span></button>
        </div>
      </div>
      <div id="chatOutput" class="stack"></div>
    </section>

    <section id="stories" class="tab">
      <div class="grid">
        <label>Level <select id="storyLevel"><option>beginner</option><option>intermediate</option></select></label>
        <label>Topic <input id="storyTopic" placeholder="market, travel, cafe, family"></label>
        <label>Length <select id="storyLength"><option>short</option><option>medium</option><option>long</option><option value="ten_minutes">10 min</option></select></label>
        <label>Tense <input id="storyTense" placeholder="present, past, future"></label>
      </div>
      <textarea id="storyVocab" rows="2" placeholder="Vocab focus"></textarea>
      <div class="actions">
        <button id="makeStory" class="primary icon-button" title="Generate story" aria-label="Generate story"><span aria-hidden="true">✦</span></button>
        <button id="playStory" class="icon-button" title="Play clause loop" aria-label="Play clause loop"><span aria-hidden="true">▶</span></button>
        <button id="favoriteStory" class="icon-button" title="Favorite story" aria-label="Favorite story"><span aria-hidden="true">★</span></button>
      </div>
      <article id="storyOutput" class="panel"></article>
    </section>

    <section id="vocab" class="tab">
      <div class="grid">
        <input id="vocabSpanish" placeholder="Spanish">
        <input id="vocabEnglish" placeholder="English">
      </div>
      <input id="vocabExample" placeholder="Example sentence">
      <div class="actions">
        <button id="addVocab" class="primary icon-button" title="Add card" aria-label="Add card"><span aria-hidden="true">＋</span></button>
        <button id="loadDue" class="icon-button" title="Load due cards" aria-label="Load due cards"><span aria-hidden="true">↻</span></button>
      </div>
      <div id="vocabOutput" class="stack"></div>
    </section>

    <section id="loops" class="tab">
      <textarea id="loopText" rows="5" placeholder="Line 1 Spanish&#10;Line 2 English&#10;Line 3 Spanish"></textarea>
      <div class="actions"><button id="playLoop" class="primary icon-button" title="Play loop" aria-label="Play loop"><span aria-hidden="true">▶</span></button></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
