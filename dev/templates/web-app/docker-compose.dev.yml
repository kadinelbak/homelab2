# Docker Compose for local development
# This file is used for development with live reload and debugging

version: '3.8'

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src:cached
      - ./:/app:ro
    ports:
      - "3000:3000"  # Debug port
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      # Point to local services for development
      - DATABASE_URL=postgres://homelab:homelab@host.docker.internal:5432/devdb
      - REDIS_URL=redis://host.docker.internal:6379
      - OLLAMA_HOST=http://host.docker.internal:11434
    # Add host.docker.internal for Mac/Windows Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Enable debugging
    # For Node.js, you might want to add: command: ["npm", "run", "dev:debug"]
    
  # Optional: Add a debugger service if needed
  # debugger:
  #   image: node:18-alpine
  #   volumes:
  #     - ./:/app
  #   command: ["sleep", "infinity"]