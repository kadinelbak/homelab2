# Docker Compose for local development of worker service
# This file is used for development with live reload and debugging

version: '3.8'

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src:cached
      - ./:/app:ro
    # Expose ports if needed for health checks or debugging
    ports:
      - "8000:8000"  # Example: if the worker exposes a health check endpoint
    environment:
      - ENV=development
      - LOG_LEVEL=debug
      # Point to local services for development
      - DATABASE_URL=postgres://homelab:homelab@host.docker.internal:5432/devdb
      - REDIS_URL=redis://host.docker.internal:6379
      - OLLAMA_HOST=http://host.docker.internal:11434
    # Add host.docker.internal for Mac/Windows Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The worker command can be overridden in the Dockerfile or here for live reload.
    # For example, to enable live reload, you might want to use a tool like `watchexec`:
    #   command: ["watchexec", "--restart", "python", "worker.py"]
    # But note: watchexec is not installed by default. You would need to install it in the Dockerfile.dev.
    # For simplicity, we leave the command to be set in Dockerfile.dev or overridden here.
    # Uncomment the following line to use a simple polling restart (not efficient but works for demo):
    # command: ["sh", "-c", "while true; do python worker.py; sleep 1; done"]
    # The actual command is defined in Dockerfile.dev.