# =============================================================================
# PHASE 4 – HEAVY COMPUTE & KNOWLEDGE (ON-DEMAND)
# Default: ALL services restart: "no" – they STAY DOWN after host reboots.
# Use scripts/toggle-ondemand.sh to wake/sleep this stack.
#
# Remote Access:  Kasm Workspaces, Apache Guacamole
# Cloud/DevOps:   Nextcloud, Gitea, Supabase
# Knowledge:      Kiwix-serve, Docmost, Cal.com, NocoDB
#
# Prereq: Phase 1 must be running.
#
# Start all:  docker compose --env-file ../.env up -d
# Stop  all:  docker compose --env-file ../.env down
# Or use:     scripts/toggle-ondemand.sh up|down
# =============================================================================

networks:
  homelab_proxy:
    external: true
  homelab_internal:
    external: true

# Shorthand anchor – applied to every service in this file
x-ondemand: &ondemand
  restart: "no"   # NEVER auto-restart – these are on-demand only

services:

  # ===========================================================================
  # REMOTE ACCESS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # KASM WORKSPACES – Browser-Based Remote Desktop
  # Runs as its own self-contained stack on port 3000 (mapped to 444 below).
  # Access: https://host:444  (Kasm has its own built-in HTTPS)
  # NOTE: Kasm requires ~2-3GB RAM when active. Spin up only when needed.
  # ---------------------------------------------------------------------------
  kasm:
    <<: *ondemand
    image: lscr.io/linuxserver/kasm:latest
    container_name: kasm
    profiles: ["kasm", "remote"]
    privileged: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      KASM_PORT: 444
    volumes:
      - ${DATA_PATH}/phase4-ondemand/data/kasm:/opt
      - ${DATA_PATH}/phase4-ondemand/data/kasm/profiles:/profiles
    ports:
      - "444:443"     # Kasm built-in HTTPS
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Kasm"
      - "homepage.icon=kasm-workspaces"
      - "homepage.href=http://${DOMAIN}:444"
      - "homepage.description=Browser desktops"

  # ---------------------------------------------------------------------------
  # APACHE GUACAMOLE – Clientless Remote Desktop Gateway
  # Proxy target: guacamole:8080/guacamole
  # IMPORTANT: On first run, initialize the DB schema:
  #   docker run --rm guacamole/guacamole /opt/guacamole/bin/initdb.sh \
  #     --postgresql > /tmp/guacamole-initdb.sql
  #   docker exec -i homelab_postgres psql -U homelab -d guacamole \
  #     < /tmp/guacamole-initdb.sql
  # ---------------------------------------------------------------------------
  guacd:
    <<: *ondemand
    image: guacamole/guacd:latest
    container_name: guacd
    profiles: ["guacamole", "remote"]
    networks:
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand Internal"
      - "homepage.name=Guacd"
      - "homepage.icon=apache-guacamole"
      - "homepage.description=Guacamole daemon"
      - "homepage.enabled=false"

  guacamole:
    <<: *ondemand
    image: guacamole/guacamole:latest
    container_name: guacamole
    profiles: ["guacamole", "remote"]
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: homelab_postgres
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8088:8080"
    networks:
      - homelab_proxy
      - homelab_internal
    depends_on:
      - guacd
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Guacamole"
      - "homepage.icon=apache-guacamole"
      - "homepage.href=http://${DOMAIN}:8088"
      - "homepage.description=Remote desktop gateway"

  # ===========================================================================
  # CLOUD / DEVOPS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # NEXTCLOUD – Self-Hosted Cloud Storage
  # Proxy target: nextcloud:80
  # Uses central postgres (database: nextcloud).
  # ---------------------------------------------------------------------------
  nextcloud:
    <<: *ondemand
    image: nextcloud:latest
    container_name: nextcloud
    profiles: ["nextcloud", "cloud"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      POSTGRES_HOST: homelab_postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      REDIS_HOST: homelab_redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${DATA_PATH}/phase4-ondemand/data/nextcloud/html:/var/www/html
      - ${DATA_PATH}/phase4-ondemand/data/nextcloud/data:/var/www/html/data
    ports:
      - "${ONDEMAND_BIND_IP:-${TAILSCALE_HOST_IP:-127.0.0.1}}:8091:80"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud"
      - "homepage.href=http://${DOMAIN}:8091"
      - "homepage.description=File sync and collaboration"

  # ---------------------------------------------------------------------------
  # GITEA – Lightweight Self-Hosted Git
  # Proxy target: gitea:3000
  # SSH: exposed on host port 2222 to avoid conflict with host SSH (22).
  # Uses central postgres (database: gitea).
  # ---------------------------------------------------------------------------
  gitea:
    <<: *ondemand
    image: gitea/gitea:latest
    container_name: gitea
    profiles: ["gitea", "devops"]
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: homelab_postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__server__DOMAIN: git.${DOMAIN}
      GITEA__server__SSH_DOMAIN: git.${DOMAIN}
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 22
      GITEA__server__SSH_LISTEN_PORT: 22
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
    volumes:
      - ${DATA_PATH}/phase4-ondemand/data/gitea:/data
    ports:
      - "2222:22"     # Gitea SSH
      - "3002:3000"   # Gitea Web UI
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Gitea"
      - "homepage.icon=gitea"
      - "homepage.href=http://${DOMAIN}:3002"
      - "homepage.description=Git hosting"

  # ---------------------------------------------------------------------------
  # SUPABASE – Open Source Firebase Alternative
  # Supabase is a complex multi-service platform. The recommended self-hosting
  # approach is to clone their official compose repo:
  #   git clone --depth 1 https://github.com/supabase/supabase
  #   cd supabase/docker && cp .env.example .env
  # The service below is a placeholder referencing their Kong gateway.
  # See: https://supabase.com/docs/guides/self-hosting/docker
  # ---------------------------------------------------------------------------
  supabase-studio:
    <<: *ondemand
    image: supabase/studio:latest
    container_name: supabase_studio
    profiles: ["supabase", "devops"]
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Homelab
      DEFAULT_PROJECT_NAME: homelab
      SUPABASE_URL: https://supabase.${DOMAIN}
      SUPABASE_PUBLIC_URL: https://supabase.${DOMAIN}
    ports:
      - "3003:3000"
    networks:
      - homelab_proxy
      - homelab_internal
    # NOTE: For full Supabase, clone their official repo. This is just the Studio UI.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Supabase Studio"
      - "homepage.icon=supabase"
      - "homepage.href=http://${DOMAIN}:3003"
      - "homepage.description=Supabase admin UI"

  # ===========================================================================
  # KNOWLEDGE & PRODUCTIVITY
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # KIWIX-SERVE – Offline Wikipedia & Reference Content
  # Proxy target: kiwix:8080
  # Download .zim files from https://download.kiwix.org/zim/ and place in
  # ${DATA_PATH}/phase4-ondemand/data/kiwix/library/
  # ---------------------------------------------------------------------------
  kiwix:
    <<: *ondemand
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    profiles: ["kiwix", "knowledge"]
    command: /data/*.zim    # Serves all .zim files in /data
    volumes:
      - ${DATA_PATH}/phase4-ondemand/data/kiwix/library:/data:ro
    ports:
      - "8095:8080"
    networks:
      - homelab_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Kiwix"
      - "homepage.icon=kiwix"
      - "homepage.href=http://${DOMAIN}:8095"
      - "homepage.description=Offline knowledge library"

  # ---------------------------------------------------------------------------
  # DOCMOST – Team Knowledge Base / Wiki (Outline alternative)
  # Proxy target: docmost:3000
  # Uses central postgres (database: outline) and central redis.
  # ---------------------------------------------------------------------------
  docmost:
    <<: *ondemand
    image: docmost/docmost:latest
    container_name: docmost
    profiles: ["docmost", "knowledge"]
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://${DOMAIN}:3004}
      APP_SECRET: ${DOCMOST_APP_SECRET}
      DATABASE_URL: ${DOCMOST_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@homelab_postgres:5432/docmost?schema=public}
      REDIS_URL: ${DOCMOST_REDIS_URL:-redis://:${REDIS_PASSWORD}@homelab_redis:6379/6}
      STORAGE_DRIVER: local
      FILE_UPLOAD_SIZE_LIMIT: ${DOCMOST_FILE_UPLOAD_SIZE_LIMIT:-50mb}
      FILE_IMPORT_SIZE_LIMIT: ${DOCMOST_FILE_IMPORT_SIZE_LIMIT:-200mb}
      DISABLE_TELEMETRY: ${DOCMOST_DISABLE_TELEMETRY:-true}
    volumes:
      - ${DATA_PATH}/phase4-ondemand/data/docmost:/app/data/storage
    ports:
      - "${ONDEMAND_BIND_IP:-${TAILSCALE_HOST_IP:-127.0.0.1}}:3004:3000"
    networks:
      - homelab_proxy
      - homelab_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Docmost"
      - "homepage.icon=docmost"
      - "homepage.href=http://${DOMAIN}:3004"
      - "homepage.description=Knowledge base"

  # ---------------------------------------------------------------------------
  # CAL.COM – Open Source Scheduling
  # Proxy target: calcom:3000
  # Uses central postgres (database: calcom).
  # ---------------------------------------------------------------------------
  calcom:
    <<: *ondemand
    image: calcom/cal.com:latest
    container_name: calcom
    profiles: ["calcom", "productivity"]
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@homelab_postgres:5432/calcom
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_CALENDSO_ENCRYPTION_KEY}
      NEXTAUTH_URL: https://cal.${DOMAIN}
      NEXT_PUBLIC_WEBAPP_URL: https://cal.${DOMAIN}
      EMAIL_FROM: ${CALCOM_EMAIL_FROM}
    ports:
      - "3005:3000"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=Cal.com"
      - "homepage.icon=cal"
      - "homepage.href=http://${DOMAIN}:3005"
      - "homepage.description=Scheduling platform"

  # ---------------------------------------------------------------------------
  # NOCODB – Airtable Alternative / No-Code Database UI
  # Proxy target: nocodb:8080
  # Uses central postgres (database: nocodb) for metadata.
  # ---------------------------------------------------------------------------
  nocodb:
    <<: *ondemand
    image: nocodb/nocodb:latest
    container_name: nocodb
    profiles: ["nocodb", "productivity"]
    environment:
      NC_DB: pg://homelab_postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb
      NC_AUTH_JWT_SECRET: ${NOCODB_SECRET}
      NC_PUBLIC_URL: https://nocodb.${DOMAIN}
    volumes:
      - ${DATA_PATH}/phase4-ondemand/data/nocodb:/usr/app/data
    ports:
      - "8098:8080"
    networks:
      - homelab_proxy
      - homelab_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "homepage.group=On-Demand"
      - "homepage.name=NocoDB"
      - "homepage.icon=nocodb"
      - "homepage.href=http://${DOMAIN}:8098"
      - "homepage.description=No-code database UI"
