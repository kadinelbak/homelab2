{% extends 'base.html' %}{% block content %}<h1>Log one-off event</h1><div class="card"><form action="/events" method="post"><label>What happened?<input name="name" placeholder="Late caffeine, illness, alcohol, travel…" required></label><label>When<input type="datetime-local" name="occurred_at" required></label><div class="grid"><label>Dose/amount<input name="dose"></label><label>Unit<input name="unit"></label></div><label>Outcome<select name="adherence"><option value="completed">Completed / occurred</option><option value="skipped">Skipped</option><option value="missed">Missed</option></select></label><label>Experiment<select name="experiment_id"><option value="">None</option>{% for e in experiments %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}</select></label><label>Notes<textarea name="notes"></textarea></label><button>Save event</button></form></div>{% endblock %}
