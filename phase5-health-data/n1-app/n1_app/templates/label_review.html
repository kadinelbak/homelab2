{% extends 'base.html' %}{% block content %}<h1>Review label</h1><div class="card"><img class="label" src="/uploads/{{ image.storage_path }}" alt="Uploaded Nutrition Facts label"><p class="muted">OCR confidence: {{ image.confidence }}%. Confirm or correct these per-serving values.</p><form action="/food/items" method="post"><input type="hidden" name="image_id" value="{{ image.id }}"><input type="hidden" name="eaten_at" value="{{ now.strftime('%Y-%m-%dT%H:%M') }}"><input type="hidden" name="label_serving_g" value="{{ image.parsed_draft.get('serving_g', '') }}"><label>Food name<input name="name" value="{{ image.original_filename }}" required></label><label>Meal<input name="meal_name" value="Meal"></label><div class="grid"><label>Servings<input name="serving_count" value="1" inputmode="decimal"></label><label>Scale weight (g)<input name="scale_weight_g" inputmode="decimal"></label><label>Calories<input name="calories" value="{{ image.parsed_draft.get('calories', 0) }}" inputmode="decimal"></label><label>Protein (g)<input name="protein_g" value="{{ image.parsed_draft.get('protein_g', 0) }}" inputmode="decimal"></label><label>Carbs (g)<input name="carbohydrates_g" value="{{ image.parsed_draft.get('carbohydrates_g', 0) }}" inputmode="decimal"></label><label>Fat (g)<input name="fat_g" value="{{ image.parsed_draft.get('fat_g', 0) }}" inputmode="decimal"></label></div><p class="muted">If the label serving grams were read, scale weight overrides servings.</p><button>Confirm and save food</button></form><details><summary>OCR text</summary><pre>{{ image.ocr_text }}</pre></details></div>{% endblock %}
