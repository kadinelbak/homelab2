global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['homelab_postgres:9187']  # postgres-exporter port

  - job_name: 'redis'
    static_configs:
      - targets: ['homelab_redis:9121']  # redis-exporter port

  - job_name: 'authentik'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['authentik_server:9000']

  - job_name: 'uptime_kuma'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['uptime_kuma:3001']

  - job_name: 'beszel'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['beszel_hub:8090']

