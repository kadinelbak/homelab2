global:
  resolve_timeout: 5m

route:
  receiver: ntfy
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: ntfy
      repeat_interval: 1h

receivers:
  - name: ntfy
    webhook_configs:
      - url: 'http://ntfy/watchtower'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
