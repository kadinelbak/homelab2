global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@homelab.local'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: 'alertmanager_password'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      - to: 'alerts@homelab.local'
        subject: 'Homelab Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Value: {{ .Value }}
          Labels: {{ .Labels }}
          Ends at: {{ .EndsAt }}
          {{ end }}

  - name: 'n8n-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/alert'
        send_resolved: true

  - name: 'ntfy'
    webhook_configs:
      - url: 'http://ntfy:80'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']