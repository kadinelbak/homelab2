global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: true

route:
  receiver: ntfy
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: email-and-ntfy
      repeat_interval: 1h

receivers:
  - name: ntfy
    webhook_configs:
      - url: 'http://ntfy/${NTFY_TOPIC}'
        send_resolved: true

  - name: email-and-ntfy
    email_configs:
      - to: '${SMTP_FROM}'
        send_resolved: true
        subject: 'Homelab alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Status: {{ .Status }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ .Labels }}
          Starts: {{ .StartsAt }}
          Ends: {{ .EndsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://ntfy/${NTFY_TOPIC}'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
