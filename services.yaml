    "phase1-core": {
      "compose": "phase1-core/docker-compose.yml",
      "project": "homelab_core",
      "order": 10
    },
    "phase2-media": {
      "compose": "phase2-media/docker-compose.yml",
      "project": "homelab_media",
      "order": 20
    },
    "phase3-ai-gaming": {
      "compose": "phase3-ai-gaming/docker-compose.yml",
      "project": "homelab_ai_gaming",
      "order": 30
    },
    "phase4-ondemand": {
      "compose": "phase4-ondemand/docker-compose.yml",
      "project": "homelab_ondemand",
      "order": 40
    }
  },
  "schedules": {
    "always": {"kind": "always"},
    "manual": {"kind": "manual"},
    "nightly": {"kind": "window", "start": "01:00", "end": "06:00"},
    "weekend-day": {"kind": "weekly-window", "days": [5, 6], "start": "09:00", "end": "23:00"},
