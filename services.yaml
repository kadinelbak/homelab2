{
  "server": {
    "ram_limit_mb_env": "HOMELAB_RAM_LIMIT_MB",
    "reserved_ram_mb_env": "HOMELAB_RESERVED_RAM_MB",
    "vram_limit_mb_env": "HOMELAB_VRAM_LIMIT_MB",
    "admission_mode_env": "HOMELAB_ADMISSION_MODE"
